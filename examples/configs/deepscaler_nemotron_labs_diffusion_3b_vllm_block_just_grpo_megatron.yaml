# BlockJustGRPO on DeepScaleR with SYNC vLLM generation (colocated, sync GRPO).
#
# The "sync cell" of the DeepScaleR backend/scheduling matrix: identical
# trainer setup and 16-node colocated topology as the SGLang production config
# it inherits, with only the generation backend swapped to vLLM (sync engine).
# Exists primarily to decompose the observed step-time difference between
# block_just_grpo_3b_bs16_leftmost_opt3_dpsync (SGLang sync, old Bridge) and
# deepscaler_bjg_3b_vllm_asyncgrpo (vLLM async, current Bridge):
#   policy_training delta -> trainer stack (Bridge/env vintage)
#   generation-off-path delta -> async architecture
#
# The vLLM engine section lives in the shared generation mixin, listed second so
# it overrides the SGLang parent's backend.
defaults:
  - "deepscaler_nemotron_labs_diffusion_3b_sglang_block_just_grpo_megatron.yaml"
  - "nemotron_labs_diffusion_3b_vllm_generation_common.yaml"

policy:
  generation:
    vllm_kwargs:
      # Leftmost reveal, 1 token/step (max_denoising_steps defaults to canvas),
      # Gumbel sampling at T=1. canvas_length comes from the generation mixin.
      diffusion_config:
        temperature: 1.0
        selection_policy: "leftmost"

    # Fixed validation decode policy, so val curves are comparable across runs
    # that roll out with different policies (leftmost / random / confidence) and
    # against the SGLang runs, whose sglang_val_dllm_overrides use the same
    # confidence-0.9 protocol. Applied by reconfigure_dllm on the live rollout
    # engines at validation and restored afterwards (no vllm_cfg key => no
    # second engine group), so it works colocated or not, and under async GRPO.
    #
    # Block size is absent on purpose: canvas_length is consumed when the engine
    # loads, so validation runs at the rollout canvas (16 here). Validating at a
    # different block size needs a dedicated engine group -- add a vllm_cfg key.
    vllm_val_dllm_overrides:
      vllm_kwargs:
        diffusion_config:
          selection_policy: "confidence_threshold"
          confidence_threshold: 0.9
          temperature: 1.0

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-block_just_grpo-deepscaler-megatron-vllm-sync"

logger:
  log_dir: "logs/grpo-nd3b-block_just_grpo-deepscaler-vllm-sync"
  wandb:
    name: "grpo-nd3b-block_just_grpo-deepscaler-vllm-sync"
