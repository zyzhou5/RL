# AR GRPO on Nemotron-Labs-Diffusion-3B, 6x6 Sudoku, vLLM generation with full
# async-GRPO (non-colocated rollout collection, trajectory staleness <= 1).
#
# Two-parent cross, built the same way as the diffusion sudoku vLLM configs:
#   - ar_grpo_sudoku6x6.yaml   AR algorithm base + the 6x6 task (sudoku6x6
#     generator, blanks-only reward with the strict format brake, few-shot
#     prompt, seq 1536 / max_new_tokens 512). This is the trainer side of the
#     SGLang AR sudoku baseline, unchanged except for the micro-batch below.
#   - nemotron_labs_diffusion_3b_vllm_generation_common.yaml   the vLLM engine
#     section, listed SECOND so it wins the backend swap. The inherited
#     sglang_cfg (including json_model_override_args '{"ar_mode": true}') stays
#     in the merged config but is inert once the backend is vllm.
#
# AR is selected under vLLM exactly as in the proven mcqa_rg AR configs:
#   - vllm_kwargs.diffusion_config: null  -> vllm_worker.py:141 takes the
#     non-diffusion branch (get("diffusion_config") or {}), so there is no
#     leftmost-reveal sampler and the mixin's canvas_length 16 is dropped.
#   - hf_overrides.architectures: NemotronLabsDiffusionForCausalLM -> the engine
#     loads the checkpoint as a causal LM (is_diffusion False), the vLLM analog
#     of the SGLang ar_mode override. Needs the AR class in the generation
#     runtime (nemotron_dllm_792ab07, commit 0a8070b68), reached via
#     NRL_VLLM_PY_EXECUTABLE.
# No vllm_val_dllm_overrides: an AR engine has no diffusion sampler to
# reconfigure, so validation decodes with the same AR policy as the rollout.
#
# TOPOLOGY. 9 nodes = 8 train + 1 generation, matching the Block-JustGRPO-Fast
# sudoku vLLM baseline so the two are directly comparable.
# train_global_batch_size 1024 must divide dp = 8 * 8 = 64 -> 16 per rank.
#
# The AR chain sets no hf_config_overrides.block_size, so the first run with
# this config pays one HF->mcore conversion of the official checkpoint.
defaults:
  - "ar_grpo_sudoku6x6.yaml"
  - "nemotron_labs_diffusion_3b_vllm_generation_common.yaml"

grpo:
  async_grpo:
    enabled: true
    # Trajectories may be at most 1 weight-version old; with age <= 1,
    # in-flight weight updates are not needed.
    max_trajectory_age_steps: 1

loss_fn:
  # Required by async_grpo_train: corrects the off-policy gap between the
  # behavior policy (vLLM rollout logprobs) and the current policy.
  use_importance_sampling_correction: true

policy:
  # mb 8, halving the inherited 16. The 16 is evidenced to work at this
  # sequence length -- ar_sudoku6x6_dllmval_smoke ran mb 16 / logprob 16 at
  # seq 1536 for 2 steps with no OOM, and did it COLOCATED, i.e. with less
  # free HBM than this non-colocated run has. What that smoke cannot cover is
  # a slow build-up: the AR mcqa_rg run (job 15161345) OOMed in
  # _compute_distributed_log_softmax only at step 58. Over a 4-hour job, 2
  # microbatches of 8 instead of 1 of 16 halves the [mb x seq x vocab]
  # temporary at the same total tokens and FLOPs, for a little launch
  # overhead. Cheap insurance; revisit if step time matters more than margin.
  train_micro_batch_size: 8
  logprob_batch_size: 8
  generation:
    vllm_cfg:
      async_engine: true
    vllm_kwargs:
      diffusion_config: null   # AR decoding: no diffusion sampler, no canvas
      hf_overrides:
        architectures: ["NemotronLabsDiffusionForCausalLM"]
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 1           # 1 generation node; cluster.num_nodes - 1 train

cluster:
  num_nodes: 9                 # 8 training + 1 generation

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-ar-sudoku6x6-megatron-vllm-async-grpo"

logger:
  log_dir: "logs/grpo-nd3b-ar-sudoku6x6-vllm-async-grpo"
  wandb:
    name: "grpo-nd3b-ar-sudoku6x6-vllm-async-grpo"
