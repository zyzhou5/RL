# BlockJustGRPO-Fast on math_with_judge ONLY, 8B v1.5-sft, 16K sequence budget
# (8K prompt + 8K generation), vLLM diffusion backend + async-GRPO + NeMo-Gym.
#
# Inherits the v30 8-agent-mix config (8B checkpoint, Fast entropy ratio 0.25,
# TP8 x CP2 + SP, async-GRPO, gym venv/cache redirection, tool parser, engine +
# proxy return_entropy) and overrides ONLY:
#   1. sequence budget      48K -> 16K, max_new_tokens 4096 -> 8192
#   2. Gym env surface      13 servers -> vllm_model + math_with_judge only
#   3. data                 v30 deterministic mix -> math_with_judge-only split
#   4. topology 15 -> 16 nodes, run dirs / wandb
#
# Data: /lustre/.../diffusion_rl/dataset/v30_math_with_judge/{train,val}.jsonl,
# built by ~/filter_math_with_judge.py from
# curriculum_v30_cobalt-zebra.train.efforts0p1_qamathcode.jsonl by keeping only
# rows whose agent_ref.name == math_with_judge_simple_agent (11,494 rows total;
# 11,238 train / 256 val, reservoir-sampled seed 0). Judge is OFF -> local
# math_verify reward, so no 235B judge server is needed.
#
# Requires: NRL_VLLM_PY_EXECUTABLE=<vllm-runtime-venv>/bin/python-compat +
# RUN_SCRIPT=examples/nemo_gym/run_grpo_nemo_gym.py + UV_EXTRAS="mcore nemo_gym".
defaults: "nemotron_labs_diffusion_8b_vllm_block_just_grpo_async_grpo_nemogym_v30.yaml"

# Topology (16 nodes): 12 train + 4 gen, NON-colocated (async-GRPO requirement).
# Train = 12 x 8 = 96 GPUs sharded TP=8 x CP=2 => dp=6; GBS 960 = 6 x 160.
# One more gen node than v30 (3): generation is 8192 tokens here vs 4096 there.
cluster:
  num_nodes: 16

grpo:
  max_num_steps: 500                 # v30 was a 50-step short run; 4h walltime chops this, resume by re-submitting the same RUN_NAME

policy:
  max_total_sequence_length: 16384   # 8K prompt + 8K generation (v30 was 49152)
  generation:
    max_new_tokens: 8192             # v30 was 4096
    colocated:
      resources:
        num_nodes: 4                 # 4 gen nodes (12 train + 4 gen = 16)
  megatron_cfg:
    tensor_model_parallel_size: 8    # inherited from v30; restated because TP8 x CP2 is the memory-safe shape
    context_parallel_size: 2
    allow_unpacked_context_parallel: true
    sequence_parallel: true

# Full replacement of the env block: the v30 parent carries per-server override
# groups (code_gen, ...) for servers this run does not launch. `_override_` only
# works on a TOP-LEVEL key, so restate the whole `env` section here.
env:
  _override_: true
  math:
    num_workers: 8
    math_verify_impl: hf_math_verify
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    uv_venv_dir: "/lustre/fsw/portfolios/coreai/users/snorouzi/gym_venvs"      # Gym per-server venvs OFF the 10G home
    uv_cache_dir: "/lustre/fsw/portfolios/coreai/users/snorouzi/gym_cache/uv"  # Gym uv cache OFF home
    skip_venv_if_present: true                                                  # reuse pre-built venvs (avoid concurrent-install race)
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml    # policy -> vLLM (NOT sglang)
      - resources_servers/math_with_judge/configs/math_with_judge.yaml          # judge OFF -> math_verify (local)
    math_with_judge:
      resources_servers:
        math_with_judge:
          should_use_judge: false    # local math_verify, no 235B judge
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 8
          return_entropy: true       # PROXY-side (JustGRPO-Fast): top_logprobs=2 + per-token entropy from the mask-token slot

data:
  train:
    data_path: "/lustre/fsw/portfolios/coreai/users/snorouzi/diffusion_rl/dataset/v30_math_with_judge/train.jsonl"
  validation:
    data_path: "/lustre/fsw/portfolios/coreai/users/snorouzi/diffusion_rl/dataset/v30_math_with_judge/val.jsonl"
    repeat: 4                        # avg@4 over 256 prompts = 1024 gens

checkpointing:
  checkpoint_dir: "results/grpo-nd8b-vllm-block-justgrpo-nemogym-math-16k"

logger:
  log_dir: "logs/grpo-nd8b-vllm-block-justgrpo-nemogym-math-16k"
  wandb:
    project: "diffusion_rl"
    name: "nd8b_vllm_block_async_grpo_nemogym_math_16k"
