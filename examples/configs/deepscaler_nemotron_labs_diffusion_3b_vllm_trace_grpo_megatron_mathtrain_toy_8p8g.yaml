# TraceGRPO on Nemotron-Labs-Diffusion-3B, MATH (Hendrycks) train split, vLLM
# generation, toy 8-GPU smoke (8 prompts x 8 generations = 64 samples, 1 node).
#
# Toy sibling of ..._mathtrain.yaml, which it now inherits from: the trainer
# side, the MATH train split, the whole vLLM diffusion generation section (via
# the shared generation mixin) and the fixed validation decode policy all come
# from there. This file only shrinks the run.
#
# Requires the reveal-steps vLLM runtime (return_reveal_steps, inherited):
#   NRL_VLLM_PY_EXECUTABLE=/lustre/fsw/portfolios/coreai/users/snorouzi/vllm_runtimes/nemotron_dllm_reveal_steps/bin/python-compat
defaults: "deepscaler_nemotron_labs_diffusion_3b_vllm_trace_grpo_megatron_mathtrain.yaml"

cluster:
  num_nodes: 1
  gpus_per_node: 8

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8

policy:
  train_global_batch_size: 64

checkpointing:
  enabled: false
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-mathtrain-megatron-vllm-toy-8p8g"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-mathtrain-vllm-toy-8p8g"
  wandb:
    name: "grpo-nd3b-trace_grpo-mathtrain-vllm-toy-8p8g"
