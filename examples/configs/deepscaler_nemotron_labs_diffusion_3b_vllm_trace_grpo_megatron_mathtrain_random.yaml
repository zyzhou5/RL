# TraceGRPO on MATH train, vLLM, RANDOM-order unmasking (instead of confidence).
# Sibling of ..._mathtrain.yaml with only the decode swapped: selection_policy
# random + t0.6 + max_denoising_steps 8 (k=2 positions/step) + emit_full_blocks
# (random reveal can commit EOS before earlier positions, so keep the whole
# block). Random reveal is drawn independently of the policy's confidence, so it
# cannot degenerate when confidence drops -> removes the confidence-decode cliff
# and its reward feedback loop.
# generation.temperature is set to 0.6 to satisfy the vLLM diffusion assert
# (generation.temperature == diffusion_config.temperature).
# NOTE: fuller stable recipe would also add num_level_samples (k) + icepop TIS;
# this is the minimal confidence->random decode swap requested.
# Submit: NODES=4, ENV_TAG=mb_3rdparty_vllm_local_fork_fixed,
#         NRL_VLLM_PY_EXECUTABLE=.../nemotron_dllm_reveal_steps/bin/python-compat
defaults: "deepscaler_nemotron_labs_diffusion_3b_vllm_trace_grpo_megatron_mathtrain.yaml"

cluster:
  num_nodes: 4

policy:
  generation:
    temperature: 0.6
    vllm_kwargs:
      diffusion_config:
        temperature: 0.6
        selection_policy: "random"
        confidence_threshold: null
        canvas_length: 16
        max_denoising_steps: 8
        emit_full_blocks: true
        return_reveal_steps: true

checkpointing:
  save_period: 25
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-mathtrain-vllm-random-4n"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-mathtrain-vllm-random-4n"
  wandb:
    name: "grpo-nd3b-trace_grpo-mathtrain-vllm-random-4n"
