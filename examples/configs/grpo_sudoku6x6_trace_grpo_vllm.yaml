# TraceGRPO on Nemotron-Labs-Diffusion-3B, 6x6 Sudoku (2x3 boxes), vLLM
# generation.
#
# Backend-swap child of grpo_sudoku6x6_trace_grpo.yaml: the entire trainer
# side is inherited (TraceGRPOMegatronPolicyWorker, logprob_estimation.type
# trace_grpo, hf_config_overrides.block_size 16, sudoku prompts/rewards,
# seq 1536 / max_new_tokens 512 / mbs 8, 8 nodes, KL 0.01 k3, no reward
# normalization). The vLLM engine section comes from the shared generation
# mixin, listed second so it overrides the SGLang parent's backend; the
# inherited sglang_cfg / sglang_val_dllm_overrides keys are inert with backend
# "vllm" (grpo.py resolves the validation-override key per backend).
#
# Reveal-step channel. Trace replays the decoding trajectory, so the rollout
# must return each token's block-relative commit step. On SGLang that needs
# FastDiffuser logprob_mode: trajectory AND return_reveal_steps (see
# tools/nemotron_diffusion/trace_fastdiffuser_bs16.yaml). On vLLM only the
# second has an analogue: the engine's at-unmask logprobs ARE SGLang's
# trajectory mode already (they are captured at the denoise step each token
# was unmasked), so diffusion_config.return_reveal_steps is the whole
# requirement. It surfaces as CompletionOutput.reveal_steps and the vLLM
# worker normalizes it into GenerationOutputs["reveal_steps"], the same key
# the SGLang worker fills from meta_info["output_token_reveal_steps"].
#
# Decode-policy mapping from trace_fastdiffuser_bs16.yaml:
#   block_size 16                -> canvas_length 16
#   max_steps 16                 -> max_denoising_steps unset (defaults to
#                                   canvas_length, i.e. 16)
#   temperature 1.0              -> temperature 1.0
#   selection_policy: confidence -> selection_policy: confidence_threshold
#   threshold 0.9                -> confidence_threshold 0.9
# vLLM's "confidence_threshold" is the port of SGLang FastDiffuser
# thresholding: unmask every masked position whose chosen-token probability
# clears the threshold, plus always the single most confident one so each
# step makes progress.
#
# Differences beyond the engine swap:
#   - exclude_mask_token_from_logits false (set in the generation mixin): the
#     vLLM sampler draws x0 from a softmax over the FULL vocab (SGLang
#     FastDiffuser excludes MASK), so the Megatron recompute must normalize the
#     same way. The trace parent sets this true for SGLang.
#   - canvas_length 16: the vLLM engine loads the HF checkpoint (block_size
#     32 on disk) independently of hf_config_overrides, so this override is
#     what keeps rollout blocking aligned with the trace estimator, which
#     inherits the model block_size (16).
#   - Validation decodes with the rollout policy. vllm_val_dllm_overrides can
#     now pin a fixed validation decode policy (runtime reconfigure for decode
#     knobs, or a dedicated engine group when vllm_cfg is present), but this
#     config does not set one, so val curves are not directly comparable to the
#     SGLang confidence-0.9 runs.
#
# Requires the custom vLLM runtime built from the fork branch carrying
# DiffusionConfig.return_reveal_steps:
#   NRL_VLLM_PY_EXECUTABLE=<vllm-runtime-venv>/bin/python-compat
defaults:
  - "grpo_sudoku6x6_trace_grpo.yaml"
  - "nemotron_labs_diffusion_3b_vllm_generation_common.yaml"

policy:
  generation:
    vllm_kwargs:
      diffusion_config:
        temperature: 1.0
        selection_policy: "confidence_threshold"
        confidence_threshold: 0.9
        # Emit each token's block-relative reveal step as
        # CompletionOutput.reveal_steps -- required by the trace estimator.
        return_reveal_steps: true

    # Fixed validation decode policy, so val curves are comparable across runs
    # that roll out with different policies (leftmost / random / confidence) and
    # against the SGLang runs, whose sglang_val_dllm_overrides use the same
    # confidence-0.9 protocol. Applied by reconfigure_dllm on the live rollout
    # engines at validation and restored afterwards (no vllm_cfg key => no
    # second engine group), so it works colocated or not, and under async GRPO.
    #
    # Block size is absent on purpose: canvas_length is consumed when the engine
    # loads, so validation runs at the rollout canvas (16 here). Validating at a
    # different block size needs a dedicated engine group -- add a vllm_cfg key.
    vllm_val_dllm_overrides:
      vllm_kwargs:
        diffusion_config:
          selection_policy: "confidence_threshold"
          confidence_threshold: 0.9
          temperature: 1.0

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-sudoku6x6-megatron-vllm"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-sudoku6x6-vllm"
  wandb:
    name: "grpo-nd3b-trace_grpo-sudoku6x6-megatron-vllm"
