# BlockJustGRPO-Fast DeepScaleR Megatron toy smoke config.
# Inherits the BlockJustGRPO toy (8 prompts x 8 generations = 64 samples) and
# turns on entropy-sparsified training: keep only the top-25% highest-entropy
# within-block offsets (fast_entropy_level_ratio=0.25 -> m=ceil(0.25*16)=4 reveal
# levels/forward passes instead of 16). Requires the SGLang server to emit
# per-token entropy, so the dLLM config points at the return_entropy: true variant.
defaults: "deepscaler_nemotron_labs_diffusion_3b_sglang_block_just_grpo_megatron_toy_8p8g.yaml"

policy:
  logprob_estimation:
    fast_entropy_level_ratio: 0.25
  generation:
    sglang_cfg:
      dllm_algorithm_config: "/home/snorouzi/diffusion_RL/RL-block-justgrpo-fast/tools/nemotron_diffusion/block_just_grpo_leftmost_dllm_bs16_entropy.yaml"

logger:
  log_dir: "logs/grpo-nd3b-block-just-grpo-fast-deepscaler-toy-8p8g"
  wandb:
    name: "grpo-nd3b-block-just-grpo-fast-deepscaler-toy-8p8g"
