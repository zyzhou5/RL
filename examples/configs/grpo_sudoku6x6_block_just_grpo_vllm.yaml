# Block JustGRPO on Nemotron-Labs-Diffusion-3B, 6x6 Sudoku, vLLM generation.
#
# Backend-swap child of grpo_sudoku6x6_block_just_grpo.yaml: the trainer side
# (block worker, block-reveal estimator at block 16, sudoku prompts/rewards,
# seq 1536 / max_new_tokens 512 / mbs 8, 8 nodes) is inherited, and the vLLM
# engine section comes from the shared generation mixin, listed second so it
# overrides the SGLang parent's backend. Inherited sglang_cfg /
# sglang_val_dllm_overrides are inert with backend "vllm".
#
# Requires the custom vLLM runtime:
#   NRL_VLLM_PY_EXECUTABLE=<vllm-runtime-venv>/bin/python-compat
defaults:
  - "grpo_sudoku6x6_block_just_grpo.yaml"
  - "nemotron_labs_diffusion_3b_vllm_generation_common.yaml"

policy:
  generation:
    vllm_kwargs:
      # Leftmost reveal, 1 token/step (max_denoising_steps defaults to
      # canvas), Gumbel sampling at T=1. canvas_length comes from the
      # generation mixin.
      diffusion_config:
        temperature: 1.0
        selection_policy: "leftmost"

    # Fixed validation decode policy, so val curves are comparable across runs
    # that roll out with different policies (leftmost / random / confidence) and
    # against the SGLang runs, whose sglang_val_dllm_overrides use the same
    # confidence-0.9 protocol. Applied by reconfigure_dllm on the live rollout
    # engines at validation and restored afterwards (no vllm_cfg key => no
    # second engine group), so it works colocated or not, and under async GRPO.
    #
    # Block size is absent on purpose: canvas_length is consumed when the engine
    # loads, so validation runs at the rollout canvas (16 here). Validating at a
    # different block size needs a dedicated engine group -- add a vllm_cfg key.
    vllm_val_dllm_overrides:
      vllm_kwargs:
        diffusion_config:
          selection_policy: "confidence_threshold"
          confidence_threshold: 0.9
          temperature: 1.0

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-block_just_grpo-sudoku6x6-megatron-vllm"

logger:
  log_dir: "logs/grpo-nd3b-block_just_grpo-sudoku6x6-vllm"
  wandb:
    name: "grpo-nd3b-block_just_grpo-sudoku6x6-vllm"
