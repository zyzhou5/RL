# Confidence+TIS async-GRPO on MATH train, vLLM, 22 nodes = 16 training + 6
# generation. Child of the 4-node async config; only scales the topology so
# training runs on 16 nodes (DP 128, batch 1024 = 8/rank) and generation gets
# 6 dedicated nodes (gen ~43-61s@128GPU -> ~6 gen nodes keeps it hidden under
# the ~130s training step). Submit NODES=22.
defaults: "deepscaler_nemotron_labs_diffusion_3b_vllm_trace_grpo_megatron_mathtrain_tis_async_4n.yaml"

cluster:
  num_nodes: 22   # 16 training + 6 generation

policy:
  generation:
    colocated:
      resources:
        gpus_per_node: 8
        num_nodes: 6

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-mathtrain-vllm-conf-tis-async-16t6g"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-mathtrain-vllm-conf-tis-async-16t6g"
  wandb:
    name: "grpo-nd3b-trace_grpo-mathtrain-vllm-conf-tis-async-16t6g"
