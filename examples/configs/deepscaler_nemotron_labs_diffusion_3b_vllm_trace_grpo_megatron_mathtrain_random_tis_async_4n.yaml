# Random-order TraceGRPO on MATH train, vLLM, FULL ASYNC-GRPO + TIS, 4 nodes
# (2 training + 2 generation, non-colocated).
#
# Child of the random mathtrain config (selection_policy random, t0.6, k2 via
# max_denoising_steps 8, emit_full_blocks). Adds the same async-GRPO + TIS
# stack as the confidence async config. Random reveal decouples the reveal
# schedule from policy confidence, so this is the head-to-head partner to the
# confidence async run (both share async-GRPO + TIS ratio 2.0).
# Node math identical: 2 train + 2 gen -> DP 16, batch 1024 (64/rank).
# Submit: NODES=4, ENV_TAG=mb_3rdparty_vllm_local_fork_fixed,
#         NRL_VLLM_PY_EXECUTABLE=.../nemotron_dllm_792ab07/bin/python-compat
defaults: "deepscaler_nemotron_labs_diffusion_3b_vllm_trace_grpo_megatron_mathtrain_random.yaml"

grpo:
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1

loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: "tis"
  truncated_importance_sampling_ratio: 2.0
  truncated_importance_sampling_ratio_min: null

policy:
  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 2
    vllm_cfg:
      async_engine: true

cluster:
  num_nodes: 4   # 2 training + 2 generation

checkpointing:
  save_period: 10
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-mathtrain-vllm-random-tis-async-4n"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-mathtrain-vllm-random-tis-async-4n"
  wandb:
    name: "grpo-nd3b-trace_grpo-mathtrain-vllm-random-tis-async-4n"
