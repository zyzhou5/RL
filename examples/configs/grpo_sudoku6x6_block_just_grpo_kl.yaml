# Block JustGRPO 6x6 with a reference-KL anchor (k3) ENABLED. Inherits the standard
# block_just_grpo 6x6 config; only turns the KL penalty on. The KL needs reference
# logprobs, so the skip flag is flipped to false (adds a reference block-reveal
# scoring pass per step; the base worker's use_reference_model() + get_logprobs
# means reference logprobs use the same block-reveal estimator as the policy).
defaults: "grpo_sudoku6x6_block_just_grpo.yaml"

grpo:
  skip_reference_policy_logprobs_calculation: false

loss_fn:
  reference_policy_kl_penalty: 0.01   # light anchor; the main knob to tune
  reference_policy_kl_type: "k3"

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-block_just_grpo-sudoku6x6-kl-megatron"

logger:
  log_dir: "logs/grpo-nd3b-block_just_grpo-sudoku6x6-kl-sglang"
  wandb:
    name: "grpo-nd3b-block_just_grpo-sudoku6x6-kl_k3"
