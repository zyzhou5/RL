# Toy smoke of the 3B math+code setup: 3 nodes (2 train + 1 gen), 8x8 batch,
# 2 steps, tiny balanced validation every step. Inherits the full mathcode config
# (3B, Fast, TP1/CP1, 4k+4k, gym servers, data) and shrinks ONLY compute +
# validation. Purpose: confirm the path runs end to end -- Gym server spinup,
# rollouts through code_gen / math_with_judge, a training step, and
# the validation path -- before committing to the 10-node run.
#
# max_new_tokens is deliberately left at the production 4096 so the smoke
# exercises the same sequence shapes and memory profile as the real run.
defaults: "nemotron_labs_diffusion_3b_vllm_block_just_grpo_async_grpo_nemogym_mathcode.yaml"

cluster:
  num_nodes: 3                       # 2 train + 1 gen

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  max_num_steps: 2
  val_period: 1                      # validate every step (exercise the val path early)

policy:
  train_global_batch_size: 64        # 8 x 8; dp=16 -> 4 samples/rank
  generation:
    colocated:
      resources:
        num_nodes: 1                 # 1 dedicated gen node

data:
  validation:
    dataset_name: NemoGymDataset
    data_path: "/lustre/fsw/portfolios/coreai/users/snorouzi/diffusion_rl/dataset/v30_deterministic/val_mathcode_toy.jsonl"
    repeat: 1                        # 24 rows x 1 = 24 val generations

checkpointing:
  save_period: 100                   # > max_num_steps -> no checkpoint written

logger:
  log_dir: "logs/grpo-nd3b-vllm-block-justgrpo-async-grpo-nemogym-mathcode-toy"
  wandb:
    project: "diffusion_rl"
    name: "nd3b_vllm_block_async_grpo_nemogym_mathcode_toy"
