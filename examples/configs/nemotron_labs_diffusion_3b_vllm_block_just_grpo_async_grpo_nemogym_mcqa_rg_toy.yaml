# Toy smoke of the 3B mcqa + reasoning_gym setup: 3 nodes (2 train + 1 gen),
# 8x8 batch, 2 steps, validation AND checkpoint save every step. Inherits the
# full mcqa_rg config (3B, Fast, gym servers for mcqa + reasoning_gym, the
# mcqa_rg train/val jsonl) and shrinks ONLY compute; purpose is to confirm the
# path runs end to end -- Gym server spinup, rollouts through both agents, a
# training step, the validation decode switch and a checkpoint write -- before
# committing to the 12-node run.
#
# max_new_tokens is deliberately left at the production value so the smoke
# exercises the same sequence shapes and memory profile as the real run.
#
# save_period 1 means this DOES write checkpoints (keep_top_k 2 is inherited);
# delete the checkpoint_dir after the smoke passes.
defaults: "nemotron_labs_diffusion_3b_vllm_block_just_grpo_async_grpo_nemogym_mcqa_rg_12n.yaml"

cluster:
  num_nodes: 3                       # 2 train + 1 gen

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  max_num_steps: 2
  val_period: 1                      # validate every step
  val_at_start: true                 # and once before training

policy:
  train_global_batch_size: 64        # 8 x 8; dp=16 -> 4 samples/rank
  generation:
    colocated:
      resources:
        num_nodes: 1                 # 1 dedicated gen node

data:
  validation:
    repeat: 1                        # 256 rows x 1 (the 12n run uses 4)

checkpointing:
  save_period: 1                     # exercise the checkpoint path every step
  checkpoint_dir: "results/grpo-nd3b-vllm-block-justgrpo-async-grpo-nemogym-mcqa-rg-toy"

logger:
  log_dir: "logs/grpo-nd3b-vllm-block-justgrpo-async-grpo-nemogym-mcqa-rg-toy"
  wandb:
    project: "diffusion_rl"
    name: "nd3b_vllm_block_async_grpo_nemogym_mcqa_rg_toy"
