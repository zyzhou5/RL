# TraceGRPO 6x6 Sudoku, random t0.6 k2, EOS constrained to block-final slots
# (eos_block_end_only). Structural exact-conditioning arm: no mid-block EOS ->
# no trimmed tail, replay exact by construction. Note this CHANGES the decoding
# distribution (the model cannot stop mid-block; expect responses padded to the
# next boundary and possibly a shifted reward baseline).
defaults: "grpo_sudoku6x6_trace_grpo_random_t06.yaml"

policy:
  generation:
    sglang_cfg:
      dllm_algorithm_config: "/home/snorouzi/diffusion_RL/RL-Trace/tools/nemotron_diffusion/trace_fastdiffuser_bs16_random_t06_k2_eosblockend.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-random-t06-sudoku6x6-eosblockend-megatron"
  save_period: 10

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-random-t06-sudoku6x6-eosblockend-sglang"
  wandb:
    name: "grpo-nd3b-trace_grpo-random-t06-sudoku6x6-eosblockend-blanks-fewshot"
