# AR GRPO on 6x6 Sudoku (with reference-KL anchor, k3) and DIFFUSION validation:
# rollouts decode on the AR engine (ar_mode causal, inherited), while validation
# decodes on a dedicated second SGLang server group running FastDiffuser
# (confidence, threshold 0.9). The AR/diffusion mode is fixed at server launch,
# so a separate group is the only way to validate under a different engine than
# rollouts.
# Both server groups need enable_memory_saver=true: they time-share GPU memory
# with training (each group sleeps except while it is generating), and the
# validation group is refit with the current policy weights right before each
# validation.
defaults: "ar_grpo_sudoku6x6_kl.yaml"

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-ar-sudoku6x6-kl-megatron-dllmval"

logger:
  log_dir: "logs/grpo-nd3b-ar-sudoku6x6-kl-sglang-dllmval"
  wandb:
    name: "grpo-nd3b-ar-sudoku6x6-kl_k3-dllmval"

policy:
  generation:
    sglang_cfg:
      enable_memory_saver: true
    # Because these overrides contain sglang_cfg, they build a DEDICATED
    # validation server group (deep-merged onto a copy of the rollout
    # generation config) instead of the runtime reconfigure path. Serving
    # knobs mirror the diffusion (justgrpo leftmost) config, not the AR one.
    sglang_val_dllm_overrides:
      sglang_cfg:
        json_model_override_args: '{}'
        dllm_algorithm: "FastDiffuser"
        dllm_algorithm_config: "/home/snorouzi/diffusion_RL/RL/tools/nemotron_diffusion/val_fastdiffuser_confidence.yaml"
        disable_cuda_graph: true
        max_running_requests: 4
        max_total_tokens: 10000
