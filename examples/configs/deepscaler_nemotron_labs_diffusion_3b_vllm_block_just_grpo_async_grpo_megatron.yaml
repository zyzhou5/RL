# BlockJustGRPO on DeepScaleR (AIME2024 val) with ASYNC vLLM generation and
# FULL async-GRPO (overlapped rollout collection, trajectory staleness <= 1).
#
# Async overlay on the SYNC vLLM config: the trainer side (block worker,
# block-reveal estimator, hf_config_overrides.block_size 16, seq 4096 /
# max_new_tokens 3744, mbs 2, DeepScaleR/AIME data) and the whole vLLM engine
# section are inherited; this file only flips the engine to async, moves to a
# non-colocated topology and turns on async-GRPO. See
# plans/sglang_to_vllm_block_just_grpo.md.
#
# Topology: NON-colocated (async-GRPO hard requirement) -- 16 training nodes
# (unchanged vs the sync SGLang config, keeps batch divisibility and
# comparability) + 2 dedicated generation nodes. DeepScaleR rollouts are long
# (3744 tokens, leftmost = 1 token/denoise-step), so generation needs more
# dedicated capacity than sudoku (1 node); 2 is a starting point -- check
# buffer_filled_ratio waits in early steps and add a node if the collector
# cannot keep up with training cadence.
#
# Inherited-but-inert: sglang_cfg + sglang_val_dllm_overrides (backend gate).
# Validation therefore decodes with the rollout policy at per-request greedy
# T=0 instead of the SGLang confidence-0.9 protocol (known Phase-2 gap) --
# val numbers are NOT directly comparable to SGLang deepscaler runs.
#
# Requires the custom vLLM runtime + the async-GRPO env recipe (nccl4py,
# NCCL 2.28.9 aligned in trainer envs -- see memory/plan doc):
#   NRL_VLLM_PY_EXECUTABLE=<vllm-runtime-venv>/bin/python-compat
defaults: "deepscaler_nemotron_labs_diffusion_3b_vllm_block_just_grpo_megatron.yaml"

grpo:
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1

loss_fn:
  # Required by async_grpo_train (off-policy samples); behavior logprobs are
  # vLLM at-unmask (gen_kl ~2e-4 vs recompute on the gsm8k fidelity runs).
  use_importance_sampling_correction: true

policy:
  generation:
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 2   # dedicated generation nodes (see topology note)
    vllm_cfg:
      async_engine: true

cluster:
  num_nodes: 18   # 16 training + 2 generation

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-block_just_grpo-deepscaler-megatron-vllm-async-grpo"

logger:
  log_dir: "logs/grpo-nd3b-block_just_grpo-deepscaler-vllm-async-grpo"
  wandb:
    name: "grpo-nd3b-block_just_grpo-deepscaler-vllm-async-grpo"
