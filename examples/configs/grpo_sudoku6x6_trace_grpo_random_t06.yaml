# TraceGRPO on 6x6 Sudoku (2x3 boxes) with RANDOM-masking generation
# (temperature 0.6). Parents: (1) the trace_grpo random-t06 algorithm base
# (FastDiffuser selection_policy: random, even schedule 16x1 per block,
# trajectory recording) and (2) grpo_sudoku6x6_base.yaml. Same setup as the
# confidence-order 6x6 run otherwise (no KL, exhaustive levels), so this
# isolates the reveal-order/temperature ablation.
defaults:
  - deepscaler_nemotron_labs_diffusion_3b_sglang_trace_grpo_megatron_t06_random.yaml
  - grpo_sudoku6x6_base.yaml

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-trace_grpo-random-t06-sudoku6x6-megatron"

logger:
  log_dir: "logs/grpo-nd3b-trace_grpo-random-t06-sudoku6x6-sglang"
  wandb:
    name: "grpo-nd3b-trace_grpo-random-t06-sudoku6x6-blanks-fewshot"

cluster:
  num_nodes: 8

policy:
  train_micro_batch_size: 8    # sudoku seq (1536) is short -> larger microbatch fits
  logprob_batch_size: 8        # match train_micro_batch_size
