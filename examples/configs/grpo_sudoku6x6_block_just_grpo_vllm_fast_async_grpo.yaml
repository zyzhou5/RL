# Block JustGRPO-Fast on Nemotron-Labs-Diffusion-3B, 6x6 Sudoku, ASYNC vLLM
# generation + async-GRPO.
#
# Entropy-sparsified child of the async-GRPO sudoku vLLM config (AsyncLLM
# engine, non-colocated, staleness <= 1; default 2 train + 1 gen nodes --
# override cluster.num_nodes at submit for larger runs, e.g. 9 = 8+1): keep
# only the top-50% highest-entropy within-block offsets
# (fast_entropy_level_ratio=0.5 -> m=ceil(0.5*16)=8 reveal levels / forward
# passes instead of 16). vllm_kwargs.diffusion_config.return_entropy makes
# the vLLM engine emit each token's at-unmask entropy through the logprobs
# channel; the async generation worker requests logprobs=1 and surfaces it
# as the optional GenerationOutputSpec "entropy" channel that the offset
# selection consumes (training fail-fasts via require_generation_entropy).
defaults: "grpo_sudoku6x6_block_just_grpo_vllm_async_grpo.yaml"

policy:
  logprob_estimation:
    fast_entropy_level_ratio: 0.5
  generation:
    vllm_kwargs:
      diffusion_config:
        return_entropy: true

checkpointing:
  checkpoint_dir: "results/grpo-nd3b-block_just_grpo-fast-sudoku6x6-megatron-vllm-async-grpo"

logger:
  log_dir: "logs/grpo-nd3b-block_just_grpo-fast-sudoku6x6-vllm-async-grpo"
  wandb:
    name: "grpo-nd3b-block_just_grpo-fast-sudoku6x6-vllm-async-grpo"
